<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 全屏深蓝背景 -->
  <rect width="1280" height="720" fill="#003366"/>

  <!-- 右侧几何装饰 -->
  <path d="M800 0 L1280 0 L1280 720 L600 720 Z" fill="#004080" fill-opacity="0.3"/>
  <rect x="1200" y="0" width="80" height="720" fill="#002244" fill-opacity="0.2"/>

  <!-- 橙色装饰条（替换原红色） -->
  <rect x="0" y="240" width="14" height="240" fill="#E87722" rx="2"/>

  <!-- 章节编号背景字 -->
  <text x="100" y="500" fill="#FFFFFF" fill-opacity="0.06" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="300" font-weight="bold">03</text>

  <!-- 橙色装饰线 -->
  <line x1="380" y1="268" x2="520" y2="268" stroke="#E87722" stroke-width="6"/>

  <!-- 章节标题 -->
  <text x="380" y="345" fill="#FFFFFF" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="56" font-weight="bold">方法脉络</text>

  <!-- 章节描述 -->
  <text x="380" y="415" fill="#E8F4FC" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="24">Chronos 时序感知框架 × 认知建模统一学习架构</text>

  <!-- 两个子标题标签 -->
  <rect x="380" y="460" width="210" height="34" fill="#E87722" fill-opacity="0.25" stroke="#E87722" stroke-width="1" rx="4"/>
  <text x="485" y="482" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="16">文献一：arXiv:2603.16862</text>

  <rect x="610" y="460" width="240" height="34" fill="#0066CC" fill-opacity="0.30" stroke="#0066CC" stroke-width="1" rx="4"/>
  <text x="730" y="482" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="16">文献二：preprints202602.1990</text>

  <!-- 底部 -->
  <text x="1240" y="690" text-anchor="end" fill="#FFFFFF" fill-opacity="0.35" font-family="Microsoft YaHei, 微软雅黑, Arial, sans-serif" font-size="18">LLM 长期记忆综述</text>
</svg>
