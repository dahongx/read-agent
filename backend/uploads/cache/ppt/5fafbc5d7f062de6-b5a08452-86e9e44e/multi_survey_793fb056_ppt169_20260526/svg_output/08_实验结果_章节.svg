<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 全屏深蓝背景 -->
  <rect width="1280" height="720" fill="#003366"/>

  <!-- 右侧几何装饰 -->
  <path d="M820 0 L1280 0 L1280 720 L620 720 Z" fill="#004080" fill-opacity="0.3"/>
  <rect x="1200" y="0" width="80" height="720" fill="#002244" fill-opacity="0.2"/>

  <!-- 橙色装饰条 -->
