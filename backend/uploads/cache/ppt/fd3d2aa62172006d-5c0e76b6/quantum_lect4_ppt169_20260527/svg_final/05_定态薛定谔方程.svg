<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3545" />
      <stop offset="100%" stop-color="#E8834A" />
    </linearGradient>
    <linearGradient id="eqBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF6FF" />
      <stop offset="100%" stop-color="#DCF0FF" />
    </linearGradient>
    <linearGradient id="expandBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F4FF" />
      <stop offset="100%" stop-color="#EEE8FF" />
    </linearGradient>
  </defs>

  
  <rect x="0" y="0" width="1280" height="720" fill="#FDFAF5" />

  
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF" />
  <rect x="0" y="78" width="1280" height="3" fill="url(#headerGrad)" />
  <path d="M1180 0 L1280 0 L1280 80 Z" fill="#DE3545" fill-opacity="0.12" />

  
  <polygon points="60,20 72,50 60,50" fill="#DE3545" />
  <polygon points="78,20 90,50 78,50" fill="#E8834A" fill-opacity="0.6" />

  
  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">新知2：定态薛定谔方程</text>

  
  <path fill="url(#eqBg)" stroke="#2E86AB" stroke-width="2" d="M70,95 H1210 A10,10 0 0 1 1220,105 V215 A10,10 0 0 1 1210,225 H70 A10,10 0 0 1 60,215 V105 A10,10 0 0 1 70,95 Z" />
  <path fill="#2E86AB" d="M63,95 H63 A3,3 0 0 1 66,98 V222 A3,3 0 0 1 63,225 H63 A3,3 0 0 1 60,222 V98 A3,3 0 0 1 63,95 Z" />

  <text x="640" y="135" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" fill="#7A6E68" text-anchor="middle">核心方程（算符形式）</text>
  
  <line x1="460" y1="142" x2="820" y2="142" stroke="#DE3545" stroke-width="2" stroke-opacity="0.4" />

  <text x="640" y="200" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="bold" fill="#2E86AB" text-anchor="middle">Ĥ ψ(r) = E ψ(r)</text>

  
  <path fill="url(#expandBg)" stroke="#9C7FD4" stroke-width="1.5" stroke-opacity="0.4" d="M68,240 H1212 A8,8 0 0 1 1220,248 V302 A8,8 0 0 1 1212,310 H68 A8,8 0 0 1 60,302 V248 A8,8 0 0 1 68,240 Z" />
  <text x="200" y="265" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">展开形式：</text>
  <text x="640" y="285" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#6B4FBB" text-anchor="middle">[ -ℏ²/2m · ∇² + V(r) ] ψ(r) = E ψ(r)</text>

  
  <path fill="#FFFFFF" stroke="#2E86AB" stroke-width="1.5" d="M70,330 H410 A10,10 0 0 1 420,340 V520 A10,10 0 0 1 410,530 H70 A10,10 0 0 1 60,520 V340 A10,10 0 0 1 70,330 Z" />
  <path fill="#2E86AB" d="M70,330 H410 A10,10 0 0 1 420,340 V368 A10,10 0 0 1 410,378 H70 A10,10 0 0 1 60,368 V340 A10,10 0 0 1 70,330 Z" />
  <rect x="60" y="358" width="360" height="20" fill="#2E86AB" />
  <text x="240" y="361" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">本征方程</text>
  <text x="240" y="410" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#2E86AB" text-anchor="middle">Ĥ ψ = E ψ</text>
  <text x="240" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">算符作用于函数</text>
  <text x="240" y="478" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">等于常数乘以该函数</text>
  <text x="240" y="510" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#A89E98" text-anchor="middle">（类比矩阵本征值问题）</text>

  <path fill="#FFFFFF" stroke="#E8834A" stroke-width="1.5" d="M470,330 H810 A10,10 0 0 1 820,340 V520 A10,10 0 0 1 810,530 H470 A10,10 0 0 1 460,520 V340 A10,10 0 0 1 470,330 Z" />
  <path fill="#E8834A" d="M470,330 H810 A10,10 0 0 1 820,340 V368 A10,10 0 0 1 810,378 H470 A10,10 0 0 1 460,368 V340 A10,10 0 0 1 470,330 Z" />
  <rect x="460" y="358" width="360" height="20" fill="#E8834A" />
  <text x="640" y="361" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">本征值 E</text>
  <text x="640" y="410" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#E8834A" text-anchor="middle">E = 能量</text>
  <text x="640" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">满足方程的特定能量值</text>
  <text x="640" y="478" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">不是任意值，是离散的</text>
  <text x="640" y="510" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#A89E98" text-anchor="middle">（量子化的根源）</text>

  <path fill="#FFFFFF" stroke="#4CAF7D" stroke-width="1.5" d="M870,330 H1210 A10,10 0 0 1 1220,340 V520 A10,10 0 0 1 1210,530 H870 A10,10 0 0 1 860,520 V340 A10,10 0 0 1 870,330 Z" />
  <path fill="#4CAF7D" d="M870,330 H1210 A10,10 0 0 1 1220,340 V368 A10,10 0 0 1 1210,378 H870 A10,10 0 0 1 860,368 V340 A10,10 0 0 1 870,330 Z" />
  <rect x="860" y="358" width="360" height="20" fill="#4CAF7D" />
  <text x="1040" y="361" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">本征函数 ψ_E</text>
  <text x="1040" y="410" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#4CAF7D" text-anchor="middle">ψ_E(r)</text>
  <text x="1040" y="450" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">对应能量 E 的空间</text>
  <text x="1040" y="478" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#7A6E68" text-anchor="middle">波函数（定态波函数）</text>
  <text x="1040" y="510" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#A89E98" text-anchor="middle">（系统的"固有振动模式"）</text>

  
  <path fill="#FFF8F0" stroke="#E8834A" stroke-width="1.5" stroke-opacity="0.5" d="M68,548 H1212 A8,8 0 0 1 1220,556 V602 A8,8 0 0 1 1212,610 H68 A8,8 0 0 1 60,602 V556 A8,8 0 0 1 68,548 Z" />
  
  <g transform="translate(80.0, 560.0) scale(1.3333333333333333)" fill="none" stroke="#E8834A">
    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
    <path d="M9.7 17l4.6 0" />
  </g>
  <text x="126" y="574" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#E8834A">类比：</text>
  <text x="200" y="574" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">就像弦的振动——只有特定频率（本征频率）才能形成驻波，</text>
  <text x="126" y="600" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">量子粒子也只有特定能量才能形成稳定的定态。</text>

  
  <rect x="0" y="690" width="1280" height="30" fill="#3D3530" fill-opacity="0.06" />
  <text x="60" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98">量子力学基础 · 定态与一维无限深方势阱</text>
  <text x="1220" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98" text-anchor="end">05</text>
</svg>