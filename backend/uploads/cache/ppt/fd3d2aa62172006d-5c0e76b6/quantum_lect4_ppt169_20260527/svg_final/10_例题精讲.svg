<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3545" />
      <stop offset="100%" stop-color="#E8834A" />
    </linearGradient>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDFAF3" />
      <stop offset="100%" stop-color="#F5FDF8" />
    </linearGradient>
  </defs>

  
  <rect x="0" y="0" width="1280" height="720" fill="#FDFAF5" />

  
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF" />
  <rect x="0" y="78" width="1280" height="3" fill="url(#headerGrad)" />
  <path d="M1180 0 L1280 0 L1280 80 Z" fill="#DE3545" fill-opacity="0.12" />

  
  <polygon points="60,20 72,50 60,50" fill="#DE3545" />
  <polygon points="78,20 90,50 78,50" fill="#E8834A" fill-opacity="0.6" />

  
  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">例题精讲：求展开系数 c_n</text>
  
  <g transform="translate(1190.0, 18.0) scale(1.8333333333333333)" fill="none" stroke="#E8834A">
    <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
    <path d="M13.5 6.5l4 4" />
  </g>

  
  <path fill="#EEF6FF" stroke="#2E86AB" stroke-width="2" d="M68,92 H1212 A8,8 0 0 1 1220,100 V174 A8,8 0 0 1 1212,182 H68 A8,8 0 0 1 60,174 V100 A8,8 0 0 1 68,92 Z" />
  <path fill="#2E86AB" d="M64,92 H64 A4,4 0 0 1 68,96 V178 A4,4 0 0 1 64,182 H64 A4,4 0 0 1 60,178 V96 A4,4 0 0 1 64,92 Z" />
  <text x="88" y="116" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#2E86AB">【题目】</text>
  <text x="88" y="145" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">已知 t=0 时，Ψ(x,0) = Ax(a-x)（0 &lt; x &lt; a），求归一化常数 A 及展开系数 c_n。</text>
  <text x="88" y="170" font-family="Consolas, monospace" font-size="17" fill="#7A6E68">（其中 ψ_n(x) = √(2/a) sin(nπx/a) 为无限深方势阱本征函数）</text>

  
  
  <path fill="#FFFFFF" stroke="#4CAF7D" stroke-width="1.5" d="M68,196 H632 A8,8 0 0 1 640,204 V318 A8,8 0 0 1 632,326 H68 A8,8 0 0 1 60,318 V204 A8,8 0 0 1 68,196 Z" />
  <path fill="#4CAF7D" fill-opacity="0.15" d="M68,196 H632 A8,8 0 0 1 640,204 V228 A8,8 0 0 1 632,236 H68 A8,8 0 0 1 60,228 V204 A8,8 0 0 1 68,196 Z" />
  <rect x="60" y="216" width="580" height="20" fill="#4CAF7D" fill-opacity="0.15" />
  <circle cx="90" cy="216" r="14" fill="#4CAF7D" />
  <text x="90" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="116" y="221" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#4CAF7D">归一化：求 A</text>
  <text x="80" y="258" font-family="Consolas, monospace" font-size="17" fill="#3D3530">∫₀ᵃ |Ax(a-x)|² dx = 1</text>
  <text x="80" y="285" font-family="Consolas, monospace" font-size="17" fill="#3D3530">A²·a⁵/30 = 1</text>
  <path fill="#4CAF7D" fill-opacity="0.12" d="M84,295 H616 A4,4 0 0 1 620,299 V313 A4,4 0 0 1 616,317 H84 A4,4 0 0 1 80,313 V299 A4,4 0 0 1 84,295 Z" />
  <text x="350" y="311" font-family="Consolas, monospace" font-size="17" fill="#4CAF7D" text-anchor="middle" font-weight="bold">A = √(30/a⁵)</text>

  
  <path fill="#FFFFFF" stroke="#2E86AB" stroke-width="1.5" d="M668,196 H1232 A8,8 0 0 1 1240,204 V318 A8,8 0 0 1 1232,326 H668 A8,8 0 0 1 660,318 V204 A8,8 0 0 1 668,196 Z" />
  <path fill="#2E86AB" fill-opacity="0.15" d="M668,196 H1232 A8,8 0 0 1 1240,204 V228 A8,8 0 0 1 1232,236 H668 A8,8 0 0 1 660,228 V204 A8,8 0 0 1 668,196 Z" />
  <rect x="660" y="216" width="580" height="20" fill="#2E86AB" fill-opacity="0.15" />
  <circle cx="690" cy="216" r="14" fill="#2E86AB" />
  <text x="690" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="716" y="221" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB">利用正交归一性求 c_n</text>
  <text x="680" y="258" font-family="Consolas, monospace" font-size="17" fill="#3D3530">c_n = ∫₀ᵃ ψ_n*(x)·Ψ(x,0) dx</text>
  <text x="680" y="285" font-family="Consolas, monospace" font-size="17" fill="#3D3530">= ∫₀ᵃ √(2/a)·sin(nπx/a)·Ax(a-x) dx</text>
  <text x="680" y="310" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">（利用分部积分计算）</text>

  
  <path fill="#FFFFFF" stroke="#E8834A" stroke-width="1.5" d="M68,340 H1212 A8,8 0 0 1 1220,348 V432 A8,8 0 0 1 1212,440 H68 A8,8 0 0 1 60,432 V348 A8,8 0 0 1 68,340 Z" />
  <path fill="#E8834A" d="M64,340 H64 A4,4 0 0 1 68,344 V436 A4,4 0 0 1 64,440 H64 A4,4 0 0 1 60,436 V344 A4,4 0 0 1 64,340 Z" />
  <circle cx="90" cy="390" r="14" fill="#E8834A" />
  <text x="90" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="116" y="365" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8834A">计算结果</text>
  
  <path fill="#FFF4EC" d="M120,372 H612 A4,4 0 0 1 616,376 V424 A4,4 0 0 1 612,428 H120 A4,4 0 0 1 116,424 V376 A4,4 0 0 1 120,372 Z" />
  <text x="366" y="396" font-family="Consolas, monospace" font-size="17" fill="#E8834A" text-anchor="middle">c_n = 0，当 n 为偶数</text>
  <text x="366" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68" text-anchor="middle">（奇函数与偶函数乘积积分为零）</text>

  <path fill="#FFF4EC" d="M640,372 H1196 A4,4 0 0 1 1200,376 V424 A4,4 0 0 1 1196,428 H640 A4,4 0 0 1 636,424 V376 A4,4 0 0 1 640,372 Z" />
  <text x="918" y="396" font-family="Consolas, monospace" font-size="17" fill="#DE3545" text-anchor="middle" font-weight="bold">c_n = 8√15 / (nπ)³，当 n 为奇数</text>
  <text x="918" y="420" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68" text-anchor="middle">（n = 1, 3, 5, ...）</text>

  
  
  <g transform="translate(1190.0, 355.0) scale(1.5)" fill="none" stroke="#4CAF7D">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>

  
  <path fill="#FFF0F1" stroke="#DE3545" stroke-width="2" d="M68,454 H1212 A8,8 0 0 1 1220,462 V556 A8,8 0 0 1 1212,564 H68 A8,8 0 0 1 60,556 V462 A8,8 0 0 1 68,454 Z" />
  <path fill="#DE3545" d="M64,454 H64 A4,4 0 0 1 68,458 V560 A4,4 0 0 1 64,564 H64 A4,4 0 0 1 60,560 V458 A4,4 0 0 1 64,454 Z" />
  
  <g transform="translate(80.0, 468.0) scale(1.3333333333333333)" fill="none" stroke="#DE3545">
    <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
    <path d="M13.5 6.5l4 4" />
    <path d="M19 16v3" />
    <path d="M19 22v.01" />
  </g>
  <text x="126" y="488" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#DE3545">【易错点提醒】</text>
  <text x="80" y="520" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan font-weight="bold" fill="#DE3545">易错1：</tspan>
    <tspan>量子数 n 从 1 开始，不是 0！n=0 时 ψ=0，无物理意义。</tspan>
  </text>
  <text x="80" y="550" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan font-weight="bold" fill="#DE3545">易错2：</tspan>
    <tspan>c_n 不是概率，|c_n|² 才是测量得到 E_n 的概率，且 Σ|c_n|² = 1。</tspan>
  </text>

  
  <path fill="#EDFAF3" stroke="#4CAF7D" stroke-width="1.5" stroke-opacity="0.5" d="M68,578 H1212 A8,8 0 0 1 1220,586 V642 A8,8 0 0 1 1212,650 H68 A8,8 0 0 1 60,642 V586 A8,8 0 0 1 68,578 Z" />
  
  <g transform="translate(80.0, 594.0) scale(1.1666666666666667)" fill="none" stroke="#4CAF7D">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
  <text x="122" y="610" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#4CAF7D">时间演化：</text>
  <text x="122" y="638" font-family="Consolas, monospace" font-size="17" fill="#3D3530">Ψ(x,t) = Σ c_n · ψ_n(x) · e^(-iE_n t/ℏ)  （叠加态，不是定态！）</text>

  
  <rect x="0" y="690" width="1280" height="30" fill="#3D3530" fill-opacity="0.06" />
  <text x="60" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98">量子力学基础 · 定态与一维无限深方势阱</text>
  <text x="1220" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98" text-anchor="end">10</text>
</svg>