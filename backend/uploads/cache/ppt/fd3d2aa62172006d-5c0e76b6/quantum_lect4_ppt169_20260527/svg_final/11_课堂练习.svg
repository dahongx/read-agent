<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3545" />
      <stop offset="100%" stop-color="#E8834A" />
    </linearGradient>
    <linearGradient id="q1Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDFAF3" />
      <stop offset="100%" stop-color="#F5FDF8" />
    </linearGradient>
    <linearGradient id="q2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF6FF" />
      <stop offset="100%" stop-color="#F5FAFF" />
    </linearGradient>
  </defs>

  
  <rect x="0" y="0" width="1280" height="720" fill="#FDFAF5" />

  
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF" />
  <rect x="0" y="78" width="1280" height="3" fill="url(#headerGrad)" />
  <path d="M1180 0 L1280 0 L1280 80 Z" fill="#DE3545" fill-opacity="0.12" />

  
  <polygon points="60,20 72,50 60,50" fill="#DE3545" />
  <polygon points="78,20 90,50 78,50" fill="#E8834A" fill-opacity="0.6" />

  
  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">课堂练习：请同学们思考</text>
  
  <g transform="translate(1190.0, 18.0) scale(1.8333333333333333)" fill="none" stroke="#4CAF7D">
    <path d="M8 8a3.5 3 0 0 1 3.5 -3h1a3.5 3 0 0 1 3.5 3a3 3 0 0 1 -2 3a3 4 0 0 0 -2 4" />
    <path d="M12 19l0 .01" />
  </g>

  
  <path fill="#4CAF7D" fill-opacity="0.12" stroke="#4CAF7D" stroke-width="1.5" stroke-opacity="0.4" d="M68,92 H1212 A8,8 0 0 1 1220,100 V132 A8,8 0 0 1 1212,140 H68 A8,8 0 0 1 60,132 V100 A8,8 0 0 1 68,92 Z" />
  <text x="640" y="122" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#4CAF7D" text-anchor="middle" font-weight="bold">请先独立思考 2 分钟，再与同桌讨论，最后我们一起来看答案</text>

  
  <path fill="url(#q1Bg)" stroke="#4CAF7D" stroke-width="2" d="M70,154 H1210 A10,10 0 0 1 1220,164 V384 A10,10 0 0 1 1210,394 H70 A10,10 0 0 1 60,384 V164 A10,10 0 0 1 70,154 Z" />
  <path fill="#4CAF7D" d="M64,154 H64 A4,4 0 0 1 68,158 V390 A4,4 0 0 1 64,394 H64 A4,4 0 0 1 60,390 V158 A4,4 0 0 1 64,154 Z" />

  
  <circle cx="100" cy="190" r="22" fill="#4CAF7D" />
  <text x="100" y="197" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Q1</text>

  <text x="140" y="185" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D3530">叠加态的能量测量</text>

  <path fill="#FFFFFF" fill-opacity="0.7" d="M86,202 H1194 A6,6 0 0 1 1200,208 V268 A6,6 0 0 1 1194,274 H86 A6,6 0 0 1 80,268 V208 A6,6 0 0 1 86,202 Z" />
  <text x="640" y="228" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530" text-anchor="middle">若粒子处于叠加态：</text>
  <text x="640" y="258" font-family="Consolas, monospace" font-size="20" fill="#2E86AB" text-anchor="middle" font-weight="bold">Ψ = (1/√2)ψ₁ + (1/√2)ψ₂</text>

  <text x="80" y="302" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan>① 测量能量可能得到哪些值？</tspan>
  </text>
  <text x="80" y="332" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan>② 得到 E₁ 和 E₂ 的概率各是多少？</tspan>
  </text>
  <text x="80" y="362" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">
    <tspan>（提示：回顾 |c_n|² 的物理意义）</tspan>
  </text>

  
  <path fill="#4CAF7D" fill-opacity="0.1" stroke="#4CAF7D" stroke-width="1" stroke-dasharray="4,3" d="M906,300 H1194 A6,6 0 0 1 1200,306 V366 A6,6 0 0 1 1194,372 H906 A6,6 0 0 1 900,366 V306 A6,6 0 0 1 906,300 Z" />
  <text x="1050" y="328" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#4CAF7D" text-anchor="middle">答案提示：</text>
  <text x="1050" y="352" font-family="Consolas, monospace" font-size="16" fill="#4CAF7D" text-anchor="middle">P(E₁) = |1/√2|² = 1/2</text>
  <text x="1050" y="372" font-family="Consolas, monospace" font-size="16" fill="#4CAF7D" text-anchor="middle">P(E₂) = |1/√2|² = 1/2</text>

  
  <path fill="url(#q2Bg)" stroke="#2E86AB" stroke-width="2" d="M70,408 H1210 A10,10 0 0 1 1220,418 V628 A10,10 0 0 1 1210,638 H70 A10,10 0 0 1 60,628 V418 A10,10 0 0 1 70,408 Z" />
  <path fill="#2E86AB" d="M64,408 H64 A4,4 0 0 1 68,412 V634 A4,4 0 0 1 64,638 H64 A4,4 0 0 1 60,634 V412 A4,4 0 0 1 64,408 Z" />

  
  <circle cx="100" cy="444" r="22" fill="#2E86AB" />
  <text x="100" y="451" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Q2</text>

  <text x="140" y="439" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D3530">势阱宽度与能量的关系</text>

  <path fill="#FFFFFF" fill-opacity="0.7" d="M86,456 H1194 A6,6 0 0 1 1200,462 V498 A6,6 0 0 1 1194,504 H86 A6,6 0 0 1 80,498 V462 A6,6 0 0 1 86,456 Z" />
  <text x="640" y="486" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530" text-anchor="middle">无限深方势阱中，基态能量 E₁ = π²ℏ²/(2ma²)</text>

  <text x="80" y="530" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan>① 若势阱宽度 a 减小为原来的一半，E₁ 如何变化？</tspan>
  </text>
  <text x="80" y="560" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" fill="#3D3530">
    <tspan>② 这说明了什么物理规律？（联系不确定性原理思考）</tspan>
  </text>
  <text x="80" y="590" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">
    <tspan>（提示：a → a/2，E₁ 变为原来的几倍？）</tspan>
  </text>

  
  <path fill="#2E86AB" fill-opacity="0.1" stroke="#2E86AB" stroke-width="1" stroke-dasharray="4,3" d="M906,530 H1194 A6,6 0 0 1 1200,536 V580 A6,6 0 0 1 1194,586 H906 A6,6 0 0 1 900,580 V536 A6,6 0 0 1 906,530 Z" />
  <text x="1050" y="554" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#2E86AB" text-anchor="middle">答案提示：</text>
  <text x="1050" y="576" font-family="Consolas, monospace" font-size="16" fill="#2E86AB" text-anchor="middle">E₁ 变为原来的 4 倍</text>

  
  <rect x="0" y="690" width="1280" height="30" fill="#3D3530" fill-opacity="0.06" />
  <text x="60" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98">量子力学基础 · 定态与一维无限深方势阱</text>
  <text x="1220" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98" text-anchor="end">11</text>
</svg>