  <text x="830" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#3D3530">思考题</text>
  <text x="830" y="292" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">为什么量子粒子</text>
  <text x="830" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">不能静止？</text>
  <text x="830" y="340" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">（零点能的物理意义）</text>
  <text x="830" y="358" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">联系不确定性原理思考</text>

  
