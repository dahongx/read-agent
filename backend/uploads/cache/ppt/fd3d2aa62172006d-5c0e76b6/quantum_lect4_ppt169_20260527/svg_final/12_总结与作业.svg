  <text x="116" y="120" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#DE3545">对照学习目标 · 本讲掌握了什么</text>

  
  <path fill="#EDFAF3" stroke="#4CAF7D" stroke-width="1" stroke-opacity="0.5" d="M86,148 H754 A6,6 0 0 1 760,154 V214 A6,6 0 0 1 754,220 H86 A6,6 0 0 1 80,214 V154 A6,6 0 0 1 86,148 Z" />
  
