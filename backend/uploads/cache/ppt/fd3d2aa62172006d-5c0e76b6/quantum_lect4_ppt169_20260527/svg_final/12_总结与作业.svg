  <text x="1010" y="400" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#2E86AB" text-anchor="middle">下讲预告</text>
  <text x="830" y="424" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">谐振子（量子 vs 经典）</text>
  <text x="830" y="448" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">升降算符方法</text>
  <text x="830" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">请预习 Griffiths 2.3 节</text>

  
