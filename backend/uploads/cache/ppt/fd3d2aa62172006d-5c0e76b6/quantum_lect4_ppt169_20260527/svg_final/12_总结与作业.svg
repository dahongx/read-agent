  <text x="1010" y="530" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#DE3545" text-anchor="middle">量子力学的奇妙之处</text>
  <text x="830" y="558" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">不是粒子"不想"静止，</text>
  <text x="830" y="580" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">而是自然界根本不允许</text>
  <text x="830" y="602" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">被完全限制的粒子静止。</text>
  <text x="830" y="624" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#DE3545" font-weight="bold">这就是量子世界的规则。</text>

  
