  </g>
  <text x="136" y="178" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#4CAF7D">能说出：定态的定义与三个特征</text>
  <text x="136" y="204" font-family="Consolas, monospace" font-size="16" fill="#3D3530">概率密度不变 · 能量确定 · 期望值不随时间变化</text>

  
  <path fill="#EEF6FF" stroke="#2E86AB" stroke-width="1" stroke-opacity="0.5" d="M86,232 H754 A6,6 0 0 1 760,238 V298 A6,6 0 0 1 754,304 H86 A6,6 0 0 1 80,298 V238 A6,6 0 0 1 86,232 Z" />
  
  <g transform="translate(96.0, 246.0) scale(1.1666666666666667)" fill="none" stroke="#2E86AB">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
  <text x="136" y="262" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB">能解释：概率密度为何不随时间变化</text>
  <text x="136" y="288" font-family="Consolas, monospace" font-size="16" fill="#3D3530">|e^(-iEt/ℏ)|² = 1，时间因子取模后消失</text>

  
  <path fill="#FFF4EC" stroke="#E8834A" stroke-width="1" stroke-opacity="0.5" d="M86,316 H754 A6,6 0 0 1 760,322 V382 A6,6 0 0 1 754,388 H86 A6,6 0 0 1 80,382 V322 A6,6 0 0 1 86,316 Z" />
  
