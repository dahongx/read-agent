  <text x="638" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8834A">物理图像：</text>
  <text x="590" y="592" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#3D3530">粒子在势阱内自由运动，在边界处被</text>
  <text x="590" y="620" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#3D3530">无限高势垒完全反射，形成驻波。</text>
  <text x="590" y="648" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#3D3530">下一步：边界条件 ψ(a) = 0 → 能量量子化！</text>

  
