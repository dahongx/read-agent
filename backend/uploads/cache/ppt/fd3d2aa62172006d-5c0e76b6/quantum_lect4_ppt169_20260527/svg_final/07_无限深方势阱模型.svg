  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">新知4：最简单的量子模型——粒子在盒子里</text>

  
  <path fill="url(#wellBg)" stroke="#2E86AB" stroke-width="1.5" stroke-opacity="0.4" d="M70,92 H540 A10,10 0 0 1 550,102 V652 A10,10 0 0 1 540,662 H70 A10,10 0 0 1 60,652 V102 A10,10 0 0 1 70,92 Z" />

  <text x="305" y="122" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#2E86AB" text-anchor="middle">势能函数 V(x)</text>

  
  
  <line x1="120" y1="500" x2="500" y2="500" stroke="#3D3530" stroke-width="2" />
  <polygon points="500,500 490,495 490,505" fill="#3D3530" />
  <text x="510" y="505" font-family="Consolas, monospace" font-size="18" fill="#3D3530">x</text>

  
  <line x1="200" y1="560" x2="200" y2="150" stroke="#3D3530" stroke-width="2" />
  <polygon points="200,150 195,160 205,160" fill="#3D3530" />
  <text x="185" y="145" font-family="Consolas, monospace" font-size="18" fill="#3D3530">V</text>

  
  <text x="200" y="522" font-family="Consolas, monospace" font-size="16" fill="#3D3530" text-anchor="middle">0</text>
  <text x="380" y="522" font-family="Consolas, monospace" font-size="16" fill="#3D3530" text-anchor="middle">a</text>
  <text x="185" y="505" font-family="Consolas, monospace" font-size="16" fill="#3D3530" text-anchor="middle">0</text>

  
  <rect x="200" y="490" width="180" height="10" fill="#4CAF7D" fill-opacity="0.3" />
  <line x1="200" y1="500" x2="380" y2="500" stroke="#4CAF7D" stroke-width="3" />
  <text x="290" y="488" font-family="Consolas, monospace" font-size="15" fill="#4CAF7D" text-anchor="middle">V = 0</text>

  
  <line x1="120" y1="500" x2="200" y2="500" stroke="#DE3545" stroke-width="3" />
  <line x1="200" y1="160" x2="200" y2="500" stroke="#DE3545" stroke-width="3" stroke-dasharray="8,4" />
  
  <rect x="120" y="160" width="80" height="340" fill="#DE3545" fill-opacity="0.08" />
  <text x="160" y="340" font-family="Arial, sans-serif" font-size="28" fill="#DE3545" text-anchor="middle" font-weight="bold">∞</text>
  <text x="160" y="370" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#DE3545" text-anchor="middle">x &lt; 0</text>

  
  <line x1="380" y1="500" x2="480" y2="500" stroke="#DE3545" stroke-width="3" />
  <line x1="380" y1="160" x2="380" y2="500" stroke="#DE3545" stroke-width="3" stroke-dasharray="8,4" />
  <rect x="380" y="160" width="100" height="340" fill="#DE3545" fill-opacity="0.08" />
  <text x="430" y="340" font-family="Arial, sans-serif" font-size="28" fill="#DE3545" text-anchor="middle" font-weight="bold">∞</text>
  <text x="430" y="370" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#DE3545" text-anchor="middle">x &gt; a</text>

  
  <line x1="200" y1="496" x2="200" y2="504" stroke="#3D3530" stroke-width="2" />
  <line x1="380" y1="496" x2="380" y2="504" stroke="#3D3530" stroke-width="2" />

  
  <path d="M200,460 Q245,420 290,460 Q335,500 380,460" stroke="#2E86AB" stroke-width="2" fill="none" stroke-dasharray="5,3" />
  <text x="290" y="545" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#7A6E68" text-anchor="middle">（粒子被完全限制在 [0, a] 内）</text>

  
  <path fill="#FFFFFF" stroke="#E8DDD5" stroke-width="1" d="M96,570 H514 A6,6 0 0 1 520,576 V636 A6,6 0 0 1 514,642 H96 A6,6 0 0 1 90,636 V576 A6,6 0 0 1 96,570 Z" />
  <text x="305" y="592" font-family="Consolas, monospace" font-size="16" fill="#4CAF7D" text-anchor="middle">V(x) = 0，  0 &lt; x &lt; a</text>
  <text x="305" y="618" font-family="Consolas, monospace" font-size="16" fill="#DE3545" text-anchor="middle">V(x) = ∞，  x ≤ 0 或 x ≥ a</text>

  
  <path fill="url(#rightBg)" stroke="#E8DDD5" stroke-width="1.5" d="M580,92 H1210 A10,10 0 0 1 1220,102 V652 A10,10 0 0 1 1210,662 H580 A10,10 0 0 1 570,652 V102 A10,10 0 0 1 580,92 Z" />

  
  <path fill="#DE3545" fill-opacity="0.1" d="M596,108 H1194 A6,6 0 0 1 1200,114 V138 A6,6 0 0 1 1194,144 H596 A6,6 0 0 1 590,138 V114 A6,6 0 0 1 596,108 Z" />
  <text x="895" y="132" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#DE3545" text-anchor="middle">边界条件</text>

  <text x="590" y="170" font-family="Consolas, monospace" font-size="20" fill="#3D3530">ψ(0) = 0</text>
  <text x="590" y="200" font-family="Consolas, monospace" font-size="20" fill="#3D3530">ψ(a) = 0</text>
  <text x="750" y="185" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">（势阱外波函数为零）</text>

  <line x1="590" y1="215" x2="1190" y2="215" stroke="#E8DDD5" stroke-width="1" />

  
  <path fill="#2E86AB" fill-opacity="0.1" d="M596,225 H1194 A6,6 0 0 1 1200,231 V255 A6,6 0 0 1 1194,261 H596 A6,6 0 0 1 590,255 V231 A6,6 0 0 1 596,225 Z" />
  <text x="895" y="249" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#2E86AB" text-anchor="middle">势阱内方程（V = 0）</text>

  <text x="590" y="290" font-family="Consolas, monospace" font-size="20" fill="#3D3530">ψ'' + k²ψ = 0</text>
  <path fill="#EEF6FF" d="M594,300 H1196 A4,4 0 0 1 1200,304 V336 A4,4 0 0 1 1196,340 H594 A4,4 0 0 1 590,336 V304 A4,4 0 0 1 594,300 Z" />
  <text x="895" y="326" font-family="Consolas, monospace" font-size="19" fill="#2E86AB" text-anchor="middle">k = √(2mE) / ℏ</text>
  <text x="590" y="360" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">（k 与粒子动能相关）</text>

  <line x1="590" y1="375" x2="1190" y2="375" stroke="#E8DDD5" stroke-width="1" />

  
  <path fill="#4CAF7D" fill-opacity="0.1" d="M596,385 H1194 A6,6 0 0 1 1200,391 V415 A6,6 0 0 1 1194,421 H596 A6,6 0 0 1 590,415 V391 A6,6 0 0 1 596,385 Z" />
  <text x="895" y="409" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#4CAF7D" text-anchor="middle">通解形式</text>

  <text x="590" y="450" font-family="Consolas, monospace" font-size="20" fill="#3D3530">ψ(x) = A sin(kx + δ)</text>
  <text x="590" y="485" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68">代入边界条件 ψ(0) = 0 → δ = 0</text>
  <text x="590" y="515" font-family="Consolas, monospace" font-size="20" fill="#4CAF7D">ψ(x) = A sin(kx)</text>

  <line x1="590" y1="530" x2="1190" y2="530" stroke="#E8DDD5" stroke-width="1" />

  
  
  <g transform="translate(595.0, 545.0) scale(1.25)" fill="none" stroke="#E8834A">
    <path d="M9 3l6 0" />
    <path d="M10 9l4 0" />
