  <text x="370" y="292" font-family="Consolas, monospace" font-size="19" fill="#2E86AB" text-anchor="middle">k = nπ/a，  n = 1, 2, 3, ...</text>
  <text x="370" y="320" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#7A6E68" text-anchor="middle">（n = 0 时 ψ = 0，无物理意义；n 不取负数）</text>

  
