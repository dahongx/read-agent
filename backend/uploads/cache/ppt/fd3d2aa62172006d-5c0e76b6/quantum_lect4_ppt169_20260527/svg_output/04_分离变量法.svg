<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3545"/>
      <stop offset="100%" stop-color="#E8834A"/>
    </linearGradient>
    <linearGradient id="formulaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#E0F0FA"/>
    </linearGradient>
    <linearGradient id="resultBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FEEADB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FDFAF5"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF"/>
  <rect x="0" y="78" width="1280" height="3" fill="url(#headerGrad)"/>
  <path d="M1180 0 L1280 0 L1280 80 Z" fill="#DE3545" fill-opacity="0.12"/>

  <!-- Title decoration -->
  <polygon points="60,20 72,50 60,50" fill="#DE3545"/>
  <polygon points="78,20 90,50 78,50" fill="#E8834A" fill-opacity="0.6"/>

  <!-- Page title -->
  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">新知1：如何求解含时薛定谔方程？</text>

  <!-- Step label -->
  <rect x="60" y="92" width="120" height="32" rx="6" fill="#2E86AB"/>
  <text x="120" y="113" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">分离变量法</text>

  <!-- Step 1 -->
  <circle cx="88" cy="160" r="22" fill="#DE3545"/>
  <text x="88" y="167" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="122" y="155" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D3530">核心假设：波函数可以分离</text>
  <rect x="122" y="168" width="1100" height="56" rx="6" fill="url(#formulaBg)" stroke="#2E86AB" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="640" y="202" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="#2E86AB" text-anchor="middle" font-weight="bold">Ψ(r, t) = ψ(r) · f(t)</text>

  <!-- Arrow down -->
  <polygon points="640,238 628,225 652,225" fill="#E8834A"/>
  <line x1="640" y1="225" x2="640" y2="245" stroke="#E8834A" stroke-width="2"/>

  <!-- Step 2 -->
  <circle cx="88" cy="278" r="22" fill="#E8834A"/>
  <text x="88" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="122" y="273" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D3530">代入薛定谔方程，两边分离</text>
  <rect x="122" y="286" width="1100" height="70" rx="6" fill="url(#formulaBg)" stroke="#2E86AB" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="640" y="315" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#3D3530" text-anchor="middle">iℏ (1/f) df/dt  =  Ĥψ(r) / ψ(r)</text>
  <text x="640" y="345" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68" text-anchor="middle">左边只含 t，右边只含 r → 两边必须等于同一常数 E</text>

  <!-- Arrow down -->
  <polygon points="640,372 628,359 652,359" fill="#E8834A"/>
  <line x1="640" y1="359" x2="640" y2="379" stroke="#E8834A" stroke-width="2"/>

  <!-- Step 3 -->
  <circle cx="88" cy="408" r="22" fill="#4CAF7D"/>
  <text x="88" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="122" y="403" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D3530">分别求解两个方程</text>

  <!-- Two sub-boxes -->
  <rect x="122" y="415" width="520" height="80" rx="6" fill="url(#formulaBg)" stroke="#2E86AB" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="382" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68" text-anchor="middle">时间方程</text>
  <text x="382" y="478" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#2E86AB" text-anchor="middle" font-weight="bold">f(t) = e^(-iEt/ℏ)</text>

  <rect x="662" y="415" width="560" height="80" rx="6" fill="#EDFAF3" stroke="#4CAF7D" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="942" y="445" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" fill="#7A6E68" text-anchor="middle">空间方程（定态薛定谔方程）</text>
  <text x="942" y="478" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#4CAF7D" text-anchor="middle" font-weight="bold">Ĥψ(r) = Eψ(r)</text>

  <!-- Key insight box -->
  <rect x="60" y="520" width="1160" height="80" rx="8" fill="#DE3545" fill-opacity="0.08" stroke="#DE3545" stroke-width="1.5" stroke-opacity="0.3"/>
  <use data-icon="tabler-outline/bulb" x="80" y="535" width="36" height="36" fill="#DE3545"/>
  <text x="130" y="553" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" font-weight="bold" fill="#DE3545">关键洞察：</text>
  <text x="130" y="585" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="20" fill="#3D3530">分离常数 E 就是粒子的能量，这是量子力学中"能量本征值"概念的起点</text>

  <!-- Footer -->
  <rect x="0" y="690" width="1280" height="30" fill="#3D3530" fill-opacity="0.06"/>
  <text x="60" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98">量子力学基础 · 定态与一维无限深方势阱</text>
  <text x="1220" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98" text-anchor="end">04</text>
</svg>
