<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE3545"/>
      <stop offset="100%" stop-color="#E8834A"/>
    </linearGradient>
    <linearGradient id="summaryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDFAF5"/>
    </linearGradient>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FDFAF5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FDFAF5"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF"/>
  <rect x="0" y="78" width="1280" height="3" fill="url(#headerGrad)"/>
  <path d="M1180 0 L1280 0 L1280 80 Z" fill="#DE3545" fill-opacity="0.12"/>

  <!-- Title decoration -->
  <polygon points="60,20 72,50 60,50" fill="#DE3545"/>
  <polygon points="78,20 90,50 78,50" fill="#E8834A" fill-opacity="0.6"/>

  <!-- Page title -->
  <text x="100" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" font-weight="bold" fill="#3D3530">本讲小结</text>
  <use data-icon="tabler-outline/checklist" x="1190" y="18" width="44" height="44" fill="#DE3545" fill-opacity="0.5"/>

  <!-- Left panel: Summary -->
  <rect x="60" y="92" width="720" height="560" rx="10" fill="url(#summaryBg)" stroke="#E8DDD5" stroke-width="1.5"/>
  <rect x="60" y="92" width="720" height="44" rx="10" fill="#DE3545" fill-opacity="0.1"/>
  <rect x="60" y="116" width="720" height="20" fill="#DE3545" fill-opacity="0.1"/>
  <use data-icon="tabler-outline/checklist" x="76" y="100" width="28" height="28" fill="#DE3545"/>
  <text x="116" y="120" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#DE3545">对照学习目标 · 本讲掌握了什么</text>

  <!-- Summary item 1 -->
  <rect x="80" y="148" width="680" height="72" rx="6" fill="#EDFAF3" stroke="#4CAF7D" stroke-width="1" stroke-opacity="0.5"/>
  <use data-icon="tabler-outline/circle-check" x="96" y="162" width="28" height="28" fill="#4CAF7D"/>
  <text x="136" y="178" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#4CAF7D">能说出：定态的定义与三个特征</text>
  <text x="136" y="204" font-family="Consolas, monospace" font-size="16" fill="#3D3530">概率密度不变 · 能量确定 · 期望值不随时间变化</text>

  <!-- Summary item 2 -->
  <rect x="80" y="232" width="680" height="72" rx="6" fill="#EEF6FF" stroke="#2E86AB" stroke-width="1" stroke-opacity="0.5"/>
  <use data-icon="tabler-outline/circle-check" x="96" y="246" width="28" height="28" fill="#2E86AB"/>
  <text x="136" y="262" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E86AB">能解释：概率密度为何不随时间变化</text>
  <text x="136" y="288" font-family="Consolas, monospace" font-size="16" fill="#3D3530">|e^(-iEt/ℏ)|² = 1，时间因子取模后消失</text>

  <!-- Summary item 3 -->
  <rect x="80" y="316" width="680" height="72" rx="6" fill="#FFF4EC" stroke="#E8834A" stroke-width="1" stroke-opacity="0.5"/>
  <use data-icon="tabler-outline/circle-check" x="96" y="330" width="28" height="28" fill="#E8834A"/>
  <text x="136" y="346" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8834A">会运用：分离变量法推导定态方程</text>
  <text x="136" y="372" font-family="Consolas, monospace" font-size="16" fill="#3D3530">Ψ = ψ(r)·f(t)  →  Ĥψ = Eψ</text>

  <!-- Summary item 4 -->
  <rect x="80" y="400" width="680" height="72" rx="6" fill="#FFF0F1" stroke="#DE3545" stroke-width="1" stroke-opacity="0.5"/>
  <use data-icon="tabler-outline/circle-check" x="96" y="414" width="28" height="28" fill="#DE3545"/>
  <text x="136" y="430" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#DE3545">会判断：无限深方势阱的能级与波函数</text>
  <text x="136" y="456" font-family="Consolas, monospace" font-size="16" fill="#3D3530">E_n = n²E₁，ψ_n = √(2/a)·sin(nπx/a)</text>

  <!-- Key formula summary -->
  <rect x="80" y="484" width="680" height="148" rx="8" fill="#3D3530" fill-opacity="0.04" stroke="#E8DDD5" stroke-width="1"/>
  <text x="420" y="508" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#7A6E68" text-anchor="middle">核心公式速查</text>
  <line x1="100" y1="515" x2="740" y2="515" stroke="#E8DDD5" stroke-width="1"/>
  <text x="100" y="538" font-family="Consolas, monospace" font-size="15" fill="#2E86AB">Ĥψ = Eψ</text>
  <text x="320" y="538" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#7A6E68">定态薛定谔方程</text>
  <text x="100" y="562" font-family="Consolas, monospace" font-size="15" fill="#DE3545">E_n = n²π²ℏ²/(2ma²)</text>
  <text x="420" y="562" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#7A6E68">能级公式</text>
  <text x="100" y="586" font-family="Consolas, monospace" font-size="15" fill="#4CAF7D">ψ_n = √(2/a)·sin(nπx/a)</text>
  <text x="480" y="586" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#7A6E68">本征函数</text>
  <text x="100" y="610" font-family="Consolas, monospace" font-size="15" fill="#E8834A">Ψ(x,t) = Σ c_n ψ_n e^(-iE_n t/ℏ)</text>
  <text x="560" y="610" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" fill="#7A6E68">一般解</text>

  <!-- Right panel: Homework -->
  <rect x="800" y="92" width="420" height="560" rx="10" fill="url(#hwBg)" stroke="#E8DDD5" stroke-width="1.5"/>
  <rect x="800" y="92" width="420" height="44" rx="10" fill="#E8834A" fill-opacity="0.12"/>
  <rect x="800" y="116" width="420" height="20" fill="#E8834A" fill-opacity="0.12"/>
  <use data-icon="tabler-outline/book" x="816" y="100" width="28" height="28" fill="#E8834A"/>
  <text x="856" y="120" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="bold" fill="#E8834A">课后作业</text>

  <!-- HW items -->
  <rect x="820" y="150" width="380" height="80" rx="6" fill="#FFFFFF" stroke="#E8DDD5" stroke-width="1"/>
  <text x="830" y="172" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#3D3530">教材习题</text>
  <text x="830" y="198" font-family="Consolas, monospace" font-size="16" fill="#2E86AB">Griffiths 2.2</text>
  <text x="830" y="220" font-family="Consolas, monospace" font-size="16" fill="#2E86AB">Griffiths 2.3</text>

  <rect x="820" y="244" width="380" height="120" rx="6" fill="#FFFFFF" stroke="#E8DDD5" stroke-width="1"/>
  <text x="830" y="266" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#3D3530">思考题</text>
  <text x="830" y="292" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">为什么量子粒子</text>
  <text x="830" y="316" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">不能静止？</text>
  <text x="830" y="340" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">（零点能的物理意义）</text>
  <text x="830" y="358" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">联系不确定性原理思考</text>

  <!-- Next lecture preview -->
  <rect x="820" y="378" width="380" height="100" rx="6" fill="#EEF6FF" stroke="#2E86AB" stroke-width="1" stroke-opacity="0.5"/>
  <text x="1010" y="400" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#2E86AB" text-anchor="middle">下讲预告</text>
  <text x="830" y="424" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">谐振子（量子 vs 经典）</text>
  <text x="830" y="448" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" fill="#3D3530">升降算符方法</text>
  <text x="830" y="468" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">请预习 Griffiths 2.3 节</text>

  <!-- Closing message -->
  <rect x="820" y="492" width="380" height="140" rx="8" fill="#DE3545" fill-opacity="0.06" stroke="#DE3545" stroke-width="1.5" stroke-opacity="0.3"/>
  <use data-icon="tabler-outline/atom" x="836" y="508" width="32" height="32" fill="#DE3545" fill-opacity="0.5"/>
  <text x="1010" y="530" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="bold" fill="#DE3545" text-anchor="middle">量子力学的奇妙之处</text>
  <text x="830" y="558" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">不是粒子"不想"静止，</text>
  <text x="830" y="580" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">而是自然界根本不允许</text>
  <text x="830" y="602" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#7A6E68">被完全限制的粒子静止。</text>
  <text x="830" y="624" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#DE3545" font-weight="bold">这就是量子世界的规则。</text>

  <!-- Bottom decorative triangles (echo cover) -->
  <path d="M0 720 L80 720 L0 640 Z" fill="#E8834A" fill-opacity="0.2"/>
  <path d="M1280 720 L1200 720 L1280 640 Z" fill="#DE3545" fill-opacity="0.2"/>

  <!-- Footer -->
  <rect x="0" y="690" width="1280" height="30" fill="#3D3530" fill-opacity="0.06"/>
  <text x="60" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98">量子力学基础 · 定态与一维无限深方势阱</text>
  <text x="1220" y="709" font-family="Arial, sans-serif" font-size="13" fill="#A89E98" text-anchor="end">12</text>
</svg>
