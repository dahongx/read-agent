<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" />
      <feOffset dx="0" dy="3" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1280" height="720" fill="#FFFFFF" />

  
  <rect x="0" y="0" width="1280" height="70" fill="#003366" />
  <rect x="0" y="0" width="6" height="70" fill="#F07C00" />
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold">02  双时态模型与实体事实提取</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">ZEP AI</text>

  
  <rect x="0" y="70" width="1280" height="50" fill="#E8F4FC" />
  <rect x="0" y="70" width="6" height="50" fill="#0066CC" />
  <text x="40" y="102" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">时间轴 T（事件顺序）+ 事务轴 T'（摄入顺序），四个时间戳管理事实生命周期，支持矛盾自动失效</text>

  

  
  <text x="55" y="160" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">双时态模型（Bi-temporal Model）</text>
  <line x1="55" y1="166" x2="400" y2="166" stroke="#F07C00" stroke-width="2" />

  
  <path fill="#FFFFFF" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1" d="M63,176 H1217 A8,8 0 0 1 1225,184 V363 A8,8 0 0 1 1217,371 H63 A8,8 0 0 1 55,363 V184 A8,8 0 0 1 63,176 Z" />

  
  <g id="t-axis">
    <path fill="#E8F4FC" d="M81,196 H614 A6,6 0 0 1 620,202 V345 A6,6 0 0 1 614,351 H81 A6,6 0 0 1 75,345 V202 A6,6 0 0 1 81,196 Z" />
    <path fill="#0066CC" d="M78,196 H78 A3,3 0 0 1 81,199 V348 A3,3 0 0 1 78,351 H78 A3,3 0 0 1 75,348 V199 A3,3 0 0 1 78,196 Z" />
    
  <g transform="translate(96.0, 208.0) scale(1.1666666666666667)" fill="none" stroke="#003366">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M12 7v5l3 3" />
  </g>
    <text x="136" y="225" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">T 轴 — 现实世界时间线（事件时序）</text>
    
    <line x1="96" y1="268" x2="560" y2="268" stroke="#0066CC" stroke-width="2" />
    <polygon points="560,263 572,268 560,273" fill="#0066CC" />
    
    <circle cx="160" cy="268" r="6" fill="#0066CC" />
    <text x="160" y="255" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">tᵥₐₗᵢ_d</text>
    <text x="160" y="290" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">事实成立</text>
    <circle cx="390" cy="268" r="6" fill="#F07C00" />
    <text x="390" y="255" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">tᵢₙᵥₐₗᵢ_d</text>
    <text x="390" y="290" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">事实失效</text>
    
    <rect x="166" y="258" width="218" height="20" fill="#0066CC" fill-opacity="0.15" />
    <text x="275" y="252" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">事实有效期</text>
    <text x="96" y="325" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">例：Alan Turing 于 1912年6月23日出生（绝对时间）</text>
    <text x="96" y="343" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">例："两周前我换了新工作"（相对时间，通过 tᵣₑf 解析）</text>
  </g>

  
  <g id="tprime-axis">
    <path fill="#FFF5E8" d="M646,196 H1199 A6,6 0 0 1 1205,202 V345 A6,6 0 0 1 1199,351 H646 A6,6 0 0 1 640,345 V202 A6,6 0 0 1 646,196 Z" />
    <path fill="#F07C00" d="M643,196 H643 A3,3 0 0 1 646,199 V348 A3,3 0 0 1 643,351 H643 A3,3 0 0 1 640,348 V199 A3,3 0 0 1 643,196 Z" />
    
  <g transform="translate(661.0, 208.0) scale(1.1666666666666667)" fill="none" stroke="#F07C00">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
    <text x="701" y="225" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">T' 轴 — 系统事务时间线（数据摄入顺序）</text>
    
    <line x1="661" y1="268" x2="1160" y2="268" stroke="#F07C00" stroke-width="2" />
    <polygon points="1160,263 1172,268 1160,273" fill="#F07C00" />
    
    <circle cx="750" cy="268" r="6" fill="#F07C00" />
    <text x="750" y="255" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">t'ₓᵣₑₐₜₑ_d</text>
    <text x="750" y="290" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">录入时间</text>
    <circle cx="1030" cy="268" r="6" fill="#003366" />
    <text x="1030" y="255" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">t'ₑₓₚᵢᵣₑ_d</text>
    <text x="1030" y="290" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">系统失效</text>
    <text x="661" y="325" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">用于数据库审计（传统作用）</text>
    <text x="661" y="343" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">新事实自动失效语义矛盾的旧边（LLM 判断冲突）</text>
  </g>

  

  
  <text x="55" y="400" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">实体与事实提取三步流程</text>
  <line x1="55" y1="406" x2="370" y2="406" stroke="#0066CC" stroke-width="2" />

  
  <g id="step-entity">
    <path fill="#FFFFFF" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1" d="M63,416 H417 A8,8 0 0 1 425,424 V618 A8,8 0 0 1 417,626 H63 A8,8 0 0 1 55,618 V424 A8,8 0 0 1 63,416 Z" />
    <path fill="#003366" d="M58,416 H58 A3,3 0 0 1 61,419 V623 A3,3 0 0 1 58,626 H58 A3,3 0 0 1 55,623 V419 A3,3 0 0 1 58,416 Z" />
    <circle cx="90" cy="450" r="18" fill="#003366" />
    <text x="90" y="456" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">1</text>
    <text x="120" y="445" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">实体提取 &amp; 解析</text>
    <text x="75" y="476" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">NER 识别命名实体（含发言人）</text>
    <text x="75" y="498" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Reflexion 反思机制减少幻觉</text>
    <text x="75" y="520" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">1024维向量嵌入（cosine搜索）</text>
    <text x="75" y="542" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">+ 全文搜索去重解析</text>
    <path fill="#E8F4FC" d="M79,564 H231 A4,4 0 0 1 235,568 V586 A4,4 0 0 1 231,590 H79 A4,4 0 0 1 75,586 V568 A4,4 0 0 1 79,564 Z" />
    <text x="155" y="582" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">n=4 上下文窗口</text>
  </g>

  
  <g id="step-fact">
    <path fill="#FFFFFF" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1" d="M463,416 H817 A8,8 0 0 1 825,424 V618 A8,8 0 0 1 817,626 H463 A8,8 0 0 1 455,618 V424 A8,8 0 0 1 463,416 Z" />
    <path fill="#0066CC" d="M458,416 H458 A3,3 0 0 1 461,419 V623 A3,3 0 0 1 458,626 H458 A3,3 0 0 1 455,623 V419 A3,3 0 0 1 458,416 Z" />
    <circle cx="490" cy="450" r="18" fill="#0066CC" />
    <text x="490" y="456" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">2</text>
    <text x="520" y="445" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">事实提取 &amp; 时序标注</text>
    <text x="475" y="476" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">抽取三元组（主-谓-宾）事实边</text>
    <text x="475" y="498" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">支持超边（多实体同一事实）</text>
    <text x="475" y="520" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">提取 tᵥₐₗᵢ_d / tᵢₙᵥₐₗᵢ_d 时间信息</text>
    <text x="475" y="542" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">同实体对内去重（约束搜索空间）</text>
    <path fill="#E8F4FC" d="M479,564 H671 A4,4 0 0 1 675,568 V586 A4,4 0 0 1 671,590 H479 A4,4 0 0 1 475,586 V568 A4,4 0 0 1 479,564 Z" />
    <text x="575" y="582" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">LLM判断语义矛盾 → 边失效</text>
  </g>

  
  <g id="step-graph">
    <path fill="#FFFFFF" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1" d="M863,416 H1217 A8,8 0 0 1 1225,424 V618 A8,8 0 0 1 1217,626 H863 A8,8 0 0 1 855,618 V424 A8,8 0 0 1 863,416 Z" />
    <path fill="#F07C00" d="M858,416 H858 A3,3 0 0 1 861,419 V623 A3,3 0 0 1 858,626 H858 A3,3 0 0 1 855,623 V419 A3,3 0 0 1 858,416 Z" />
    <circle cx="890" cy="450" r="18" fill="#F07C00" />
    <text x="890" y="456" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">3</text>
    <text x="920" y="445" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">Neo4j 图集成</text>
    <text x="875" y="476" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Cypher 预定义查询写入图数据库</text>
    <text x="875" y="498" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">避免 LLM 生成查询的不一致风险</text>
    <text x="875" y="520" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">双向索引：语义边 ↔ 源情节</text>
    <text x="875" y="542" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">确保 schema 格式一致性</text>
    <path fill="#FFF5E8" d="M879,564 H1071 A4,4 0 0 1 1075,568 V586 A4,4 0 0 1 1071,590 H879 A4,4 0 0 1 875,586 V568 A4,4 0 0 1 879,564 Z" />
    <text x="975" y="582" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">支持前向/反向溯源查询</text>
  </g>

  
  <line x1="425" y1="520" x2="453" y2="520" stroke="#D0D7E0" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="453,515 465,520 453,525" fill="#0066CC" />
  <line x1="825" y1="520" x2="853" y2="520" stroke="#D0D7E0" stroke-width="1.5" stroke-dasharray="4,3" />
  <polygon points="853,515 865,520 853,525" fill="#F07C00" />

  
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#E8F4FC" stroke-width="1" />
  <text x="40" y="695" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源：arXiv:2501.13956v1 §2.1–2.2</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">知识图谱构建</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">5 / 12</text>
</svg>