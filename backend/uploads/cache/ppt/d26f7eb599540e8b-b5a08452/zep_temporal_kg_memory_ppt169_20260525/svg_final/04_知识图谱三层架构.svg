    <text x="75" y="400" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">支持相对日期解析（"下周四"等）</text>
    <line x1="75" y1="418" x2="400" y2="418" stroke="#E8F4FC" stroke-width="1.5" />
    
