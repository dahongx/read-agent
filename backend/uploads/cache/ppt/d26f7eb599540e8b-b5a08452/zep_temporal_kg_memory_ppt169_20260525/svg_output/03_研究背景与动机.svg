<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#F07C00"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold">01  研究背景与动机</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">ZEP AI</text>

  <!-- 核心观点条 -->
  <rect x="0" y="70" width="1280" height="50" fill="#E8F4FC"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">LLM 上下文窗口有限，传统 RAG 无法处理动态演化的企业数据 → Zep 以时序知识图谱解决这一根本局限</text>

  <!-- ============ 内容区 y=135~665 ============ -->

  <!-- 左侧标题 (4列) -->
  <g id="left-col">
    <!-- 左侧标题 -->
    <text x="55" y="168" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">三大核心挑战</text>
    <line x1="55" y1="174" x2="290" y2="174" stroke="#F07C00" stroke-width="2"/>

    <!-- 问题卡片1: 上下文窗口限制 -->
    <g id="problem-1">
      <rect x="55" y="185" width="460" height="130" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
      <rect x="55" y="185" width="6" height="130" fill="#F07C00" rx="3"/>
      <use data-icon="tabler-outline/brain" x="74" y="200" width="32" height="32" fill="#003366"/>
      <text x="116" y="222" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">上下文窗口限制</text>
      <text x="74" y="246" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">完整对话历史无法放入 LLM 上下文（企业</text>
      <text x="74" y="266" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">场景对话平均达 115,000 tokens）</text>
      <text x="74" y="291" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">→ 需要外部记忆机制压缩并检索历史信息</text>
    </g>

    <!-- 问题卡片2: 静态RAG局限 -->
    <g id="problem-2">
      <rect x="55" y="328" width="460" height="130" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
      <rect x="55" y="328" width="6" height="130" fill="#0066CC" rx="3"/>
      <use data-icon="tabler-outline/database" x="74" y="343" width="32" height="32" fill="#003366"/>
      <text x="116" y="365" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">静态 RAG 局限</text>
      <text x="74" y="390" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">现有 RAG 只能检索静态文档，无法追踪</text>
      <text x="74" y="410" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">关系演化（如 "Alice 上周换了工作"）</text>
      <text x="74" y="435" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">→ 需要动态知识集成与时效性管理</text>
    </g>

    <!-- 问题卡片3: 幻觉与不一致 -->
    <g id="problem-3">
      <rect x="55" y="470" width="460" height="130" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
      <rect x="55" y="470" width="6" height="130" fill="#003366" rx="3"/>
      <use data-icon="tabler-outline/ai-agent" x="74" y="485" width="32" height="32" fill="#003366"/>
      <text x="116" y="507" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">幻觉与记忆不一致</text>
      <text x="74" y="532" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">缺乏结构化记忆导致 LLM 生成过时或错误</text>
      <text x="74" y="552" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">事实，跨会话信息无法有效融合</text>
      <text x="74" y="577" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">→ 需要可溯源、可验证的事实管理</text>
    </g>
  </g>

  <!-- 右侧解决方案 (6列) -->
  <g id="right-col">
    <text x="560" y="168" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">Zep 解决方案</text>
    <line x1="560" y1="174" x2="780" y2="174" stroke="#0066CC" stroke-width="2"/>

    <!-- 解决方案主卡片 -->
    <rect x="560" y="185" width="680" height="420" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#0066CC" stroke-width="1.5"/>

    <!-- Zep 核心概念 -->
    <rect x="560" y="185" width="680" height="70" fill="#003366" rx="8"/>
    <rect x="560" y="225" width="680" height="30" fill="#003366"/>
    <text x="900" y="228" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">Zep = Graphiti 时序知识图谱引擎</text>
    <text x="900" y="248" text-anchor="middle" fill="#AACCEE" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Temporal Knowledge Graph for Agent Memory</text>

    <!-- 三点解决方式 -->
    <!-- 1 -->
    <g id="sol-1">
      <circle cx="596" cy="318" r="18" fill="#F07C00"/>
      <text x="596" y="324" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">1</text>
      <text x="626" y="313" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">动态知识摄入</text>
      <text x="626" y="334" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">同时处理非结构化对话 + 结构化业务数据</text>
    </g>
    <line x1="596" y1="345" x2="596" y2="380" stroke="#D0D7E0" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- 2 -->
    <g id="sol-2">
      <circle cx="596" cy="395" r="18" fill="#0066CC"/>
      <text x="596" y="401" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">2</text>
      <text x="626" y="390" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">时序事实维护</text>
      <text x="626" y="411" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">追踪事实有效期，自动失效过时信息</text>
    </g>
    <line x1="596" y1="422" x2="596" y2="457" stroke="#D0D7E0" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- 3 -->
    <g id="sol-3">
      <circle cx="596" cy="472" r="18" fill="#003366"/>
      <text x="596" y="478" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">3</text>
      <text x="626" y="467" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">生产级性能</text>
      <text x="626" y="488" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">准确率、延迟、可扩展性三维兼顾</text>
    </g>

    <!-- 底部性能预告 -->
    <rect x="575" y="516" width="650" height="68" fill="#E8F4FC" rx="6"/>
    <rect x="575" y="516" width="4" height="68" fill="#F07C00"/>
    <text x="596" y="541" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">核心成果预览</text>
    <text x="596" y="561" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">DMR 94.8% 准确率（超越 MemGPT 93.4%）</text>
    <text x="596" y="577" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">LongMemEval 精度提升 18.5%，延迟降低 90%</text>
  </g>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#E8F4FC" stroke-width="1"/>
  <text x="40" y="695" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源：arXiv:2501.13956v1</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">研究背景与动机</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">3 / 12</text>
</svg>
