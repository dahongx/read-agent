<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#F07C00" flood-opacity="0.40" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#F07C00"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold">05  LongMemEval：准确率 ↑，延迟 ↓ 90%</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">ZEP AI</text>

  <!-- 核心观点条 -->
  <rect x="0" y="70" width="1280" height="50" fill="#E8F4FC"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">Zep 准确率提升 15.2–18.5%，响应延迟降低 90%，上下文 tokens 压缩 99%</text>

  <!-- ====== 顶部：准确率对比柱状图 ====== -->

  <text x="55" y="158" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">LongMemEval-s 准确率对比</text>
  <line x1="55" y1="164" x2="310" y2="164" stroke="#0066CC" stroke-width="2"/>

  <!-- 图表区域 -->
  <rect x="55" y="172" width="750" height="250" fill="#FAFAFA" rx="6" stroke="#E8F4FC" stroke-width="1"/>

  <!-- Y轴标签 -->
  <text x="90" y="205" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">100%</text>
  <line x1="110" y1="200" x2="780" y2="200" stroke="#E8F4FC" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="245" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">75%</text>
  <line x1="110" y1="240" x2="780" y2="240" stroke="#E8F4FC" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="285" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">50%</text>
  <line x1="110" y1="280" x2="780" y2="280" stroke="#E8F4FC" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="325" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">25%</text>
  <line x1="110" y1="320" x2="780" y2="320" stroke="#E8F4FC" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 底部轴线 -->
  <line x1="110" y1="395" x2="780" y2="395" stroke="#D0D7E0" stroke-width="1.5"/>

  <!--
    Y轴：25%=320, 50%=280, 75%=240, 100%=200
    每1% = (320-200)/75 = 1.6px... 实际：0%=395, 100%=200 → 每1%=1.95px
    bar_top = 395 - pct*1.95
    bar_height = pct*1.95
  -->

  <!-- gpt-4o-mini 组 -->
  <!-- Full-context mini: 55.4% → bar_top=395-55.4*1.95=287.7, h=108 -->
  <g id="group-mini">
    <!-- Full-context -->
    <rect x="180" y="288" width="80" height="107" fill="#668BBB" rx="4"/>
    <text x="220" y="280" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">55.4%</text>
    <!-- Zep mini: 63.8% → bar_top=395-63.8*1.95=270.6, h=124 -->
    <rect x="270" y="271" width="80" height="124" fill="#F07C00" rx="4"/>
    <text x="310" y="263" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" filter="url(#glowOrange)">63.8%</text>
    <!-- 组标签 -->
    <text x="255" y="415" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">gpt-4o-mini</text>
    <!-- 提升箭头 -->
    <line x1="285" y1="271" x2="265" y2="271" stroke="#F07C00" stroke-width="1.5"/>
    <line x1="285" y1="288" x2="265" y2="288" stroke="#999999" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="220" y="230" width="70" height="24" fill="#F07C00" rx="3"/>
    <text x="255" y="247" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">+15.2%</text>
  </g>

  <!-- gpt-4o 组 -->
  <!-- Full-context gpt-4o: ~62% → bar_top=395-62*1.95=274, h=121 -->
  <!-- Zep gpt-4o: ~73% → bar_top=395-73*1.95=252.6, h=142 -->
  <g id="group-4o">
    <rect x="470" y="274" width="80" height="121" fill="#668BBB" rx="4"/>
    <text x="510" y="266" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">~62%</text>
    <rect x="560" y="253" width="80" height="142" fill="#F07C00" rx="4"/>
    <text x="600" y="245" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" filter="url(#glowOrange)">~73%</text>
    <text x="545" y="415" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">gpt-4o</text>
    <rect x="500" y="220" width="70" height="24" fill="#F07C00" rx="3"/>
    <text x="535" y="237" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">+18.5%</text>
  </g>

  <!-- 图例 -->
  <rect x="115" y="428" width="16" height="14" fill="#668BBB" rx="2"/>
  <text x="138" y="440" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">Full-context 基线</text>
  <rect x="265" y="428" width="16" height="14" fill="#F07C00" rx="2"/>
  <text x="288" y="440" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">Zep（本文方法）</text>

  <!-- ====== 底部：KPI 数字卡片 ====== -->

  <text x="55" y="488" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">关键效率指标（gpt-4o-mini）</text>
  <line x1="55" y1="494" x2="340" y2="494" stroke="#F07C00" stroke-width="2"/>

  <!-- KPI 1: 准确率 -->
  <g id="kpi-acc">
    <rect x="55" y="504" width="170" height="110" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
    <text x="140" y="543" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" filter="url(#glowOrange)">+15.2%</text>
    <text x="140" y="567" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">准确率提升</text>
    <text x="140" y="585" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">55.4% → 63.8%</text>
    <text x="140" y="602" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">gpt-4o-mini</text>
  </g>

  <!-- KPI 2: 延迟 -->
  <g id="kpi-latency">
    <rect x="240" y="504" width="170" height="110" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
    <text x="325" y="543" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" filter="url(#glowOrange)">-90%</text>
    <text x="325" y="567" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">响应延迟降低</text>
    <text x="325" y="585" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">31.3s → 3.20s</text>
    <text x="325" y="602" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">中位响应时间</text>
  </g>

  <!-- KPI 3: Tokens -->
  <g id="kpi-tokens">
    <rect x="425" y="504" width="170" height="110" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
    <text x="510" y="543" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" filter="url(#glowOrange)">-99%</text>
    <text x="510" y="567" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">上下文压缩</text>
    <text x="510" y="585" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">115k → 1.6k tokens</text>
    <text x="510" y="602" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">平均上下文长度</text>
  </g>

  <!-- KPI 4: IQR -->
  <g id="kpi-iqr">
    <rect x="610" y="504" width="195" height="110" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
    <text x="707" y="543" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold">3.20s</text>
    <text x="707" y="567" text-anchor="middle" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">Zep 平均延迟</text>
    <text x="707" y="585" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">IQR: 1.6s（稳定）</text>
    <text x="707" y="602" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">vs 基线 IQR: 8.76s</text>
  </g>

  <!-- ====== 右侧：详细数据表 ====== -->
  <g id="right-table">
    <text x="830" y="158" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">详细结果（LongMemEval-s）</text>
    <line x1="830" y1="164" x2="1100" y2="164" stroke="#0066CC" stroke-width="2"/>

    <rect x="830" y="172" width="405" height="480" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>

    <!-- 表头 -->
    <rect x="830" y="172" width="405" height="36" fill="#003366" rx="8"/>
    <rect x="830" y="196" width="405" height="12" fill="#003366"/>
    <text x="900" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">方法</text>
    <text x="1005" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">准确率</text>
    <text x="1100" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">延迟(s)</text>
    <text x="1200" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">Ctx Tokens</text>
    <line x1="950" y1="208" x2="950" y2="622" stroke="#E8F4FC" stroke-width="1"/>
    <line x1="1060" y1="208" x2="1060" y2="622" stroke="#E8F4FC" stroke-width="1"/>
    <line x1="1150" y1="208" x2="1150" y2="622" stroke="#E8F4FC" stroke-width="1"/>

    <!-- 行1 -->
    <rect x="830" y="208" width="405" height="38" fill="#F5F7FA"/>
    <text x="840" y="232" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">Full-ctx</text>
    <text x="840" y="244" fill="#888888" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">gpt-4o-mini</text>
    <text x="1005" y="232" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">55.4%</text>
    <text x="1100" y="232" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">31.3</text>
    <text x="1200" y="232" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">115k</text>

    <!-- 行2 (Zep highlighted) -->
    <rect x="830" y="246" width="405" height="38" fill="#FFF5E8"/>
    <rect x="830" y="246" width="4" height="38" fill="#F07C00"/>
    <text x="840" y="270" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">Zep</text>
    <text x="840" y="282" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">gpt-4o-mini ★</text>
    <text x="1005" y="270" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">63.8%</text>
    <text x="1100" y="270" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">3.20</text>
    <text x="1200" y="270" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">1.6k</text>

    <!-- 分隔 -->
    <line x1="840" y1="291" x2="1220" y2="291" stroke="#D0D7E0" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- 行3 -->
    <rect x="830" y="296" width="405" height="38" fill="#F5F7FA"/>
    <text x="840" y="320" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">Full-ctx</text>
    <text x="840" y="332" fill="#888888" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">gpt-4o</text>
    <text x="1005" y="320" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">~62%</text>
    <text x="1100" y="320" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">~35</text>
    <text x="1200" y="320" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">115k</text>

    <!-- 行4 (Zep gpt-4o highlighted) -->
    <rect x="830" y="334" width="405" height="38" fill="#FFF5E8"/>
    <rect x="830" y="334" width="4" height="38" fill="#F07C00"/>
    <text x="840" y="358" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">Zep</text>
    <text x="840" y="370" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11">gpt-4o ★</text>
    <text x="1005" y="358" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">~73%</text>
    <text x="1100" y="358" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">~3.5</text>
    <text x="1200" y="358" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">1.6k</text>

    <!-- 核心洞察 -->
    <rect x="840" y="390" width="378" height="76" fill="#E8F4FC" rx="6"/>
    <text x="1029" y="412" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">两大核心优势</text>
    <text x="855" y="432" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">✓ 更高准确率（+15~18.5%）</text>
    <text x="855" y="452" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">✓ 更低延迟 + 大幅节省推理 token 成本</text>

    <!-- 企业价值 -->
    <rect x="840" y="478" width="378" height="96" fill="#FFFFFF" rx="6" stroke="#0066CC" stroke-width="1"/>
    <text x="1029" y="500" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">企业部署价值</text>
    <text x="855" y="522" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">↓ tokens: 显著降低 API 调用成本</text>
    <text x="855" y="542" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">↓ 延迟: 改善用户交互体验</text>
    <text x="855" y="562" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">↑ 准确率: 减少幻觉与错误应答</text>
  </g>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#E8F4FC" stroke-width="1"/>
  <text x="40" y="695" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源：arXiv:2501.13956v1 Table 2 §4.3</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">实验结果</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">10 / 12</text>
</svg>
