<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#F07C00"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="bold">05  实验设计与基准选择</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">ZEP AI</text>

  <!-- 核心观点条 -->
  <rect x="0" y="70" width="1280" height="50" fill="#E8F4FC"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">两大基准覆盖不同难度：DMR 测短会话事实检索，LongMemEval 测长对话复杂时序推理</text>

  <!-- ====== 左侧：两个基准介绍 ====== -->
  <g id="left-benchmarks">
    <text x="55" y="158" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">两大评测基准</text>
    <line x1="55" y1="164" x2="260" y2="164" stroke="#F07C00" stroke-width="2"/>

    <!-- DMR 基准卡片 -->
    <g id="dmr-card">
      <rect x="55" y="174" width="565" height="210" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>
      <rect x="55" y="174" width="565" height="52" fill="#003366" rx="8"/>
      <rect x="55" y="206" width="565" height="20" fill="#003366"/>
      <text x="88" y="206" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">DMR（Deep Memory Retrieval）</text>
      <text x="88" y="222" fill="#AACCEE" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">基准来源：MemGPT [Packer et al., 2023]</text>
      <!-- 指标 -->
      <g id="dmr-metrics">
        <rect x="75" y="240" width="130" height="56" fill="#E8F4FC" rx="6"/>
        <text x="140" y="264" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">500</text>
        <text x="140" y="285" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">对话数量</text>

        <rect x="215" y="240" width="130" height="56" fill="#E8F4FC" rx="6"/>
        <text x="280" y="264" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">5×12</text>
        <text x="280" y="285" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">会话×消息</text>

        <rect x="355" y="240" width="130" height="56" fill="#E8F4FC" rx="6"/>
        <text x="420" y="264" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">60</text>
        <text x="420" y="285" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">条消息/对话</text>
      </g>
      <text x="75" y="325" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">问答类型：单轮事实问答（Who/What/When）</text>
      <text x="75" y="347" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">数据集：Multi-Session Chat（500条对话子集）</text>
      <rect x="75" y="358" width="525" height="18" fill="#FFF5E8" rx="3"/>
      <text x="337" y="371" text-anchor="middle" fill="#F07C00" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">局限：60条消息可完整放入 LLM 上下文窗口，难以区分记忆方案优劣</text>
    </g>

    <!-- LongMemEval 基准卡片 -->
    <g id="lme-card">
      <rect x="55" y="400" width="565" height="230" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#0066CC" stroke-width="1.5"/>
      <rect x="55" y="400" width="565" height="52" fill="#0066CC" rx="8"/>
      <rect x="55" y="432" width="565" height="20" fill="#0066CC"/>
      <text x="88" y="432" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">LongMemEval (LME-s)</text>
      <text x="88" y="448" fill="#CCE5FF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">基准来源：[Wu et al., 2024]  更贴近企业真实场景</text>
      <!-- 指标 -->
      <g id="lme-metrics">
        <rect x="75" y="466" width="160" height="56" fill="#E8F4FC" rx="6"/>
        <text x="155" y="490" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">~115k</text>
        <text x="155" y="510" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">平均 tokens/对话</text>

        <rect x="245" y="466" width="150" height="56" fill="#E8F4FC" rx="6"/>
        <text x="320" y="490" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">6类</text>
        <text x="320" y="510" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">问题类型</text>

        <rect x="405" y="466" width="200" height="56" fill="#E8F4FC" rx="6"/>
        <text x="505" y="490" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">GPT-4o</text>
        <text x="505" y="510" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">答案评判模型</text>
      </g>
      <text x="75" y="548" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">6种问题类型：单会话用户/助手、偏好、跨会话、</text>
      <text x="75" y="568" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">知识更新、时序推理</text>
      <rect x="75" y="580" width="525" height="18" fill="#E8F4FC" rx="3"/>
      <text x="337" y="593" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">优势：真实企业场景，复杂时序推理，更有区分度</text>
    </g>
  </g>

  <!-- 中间分割线 -->
  <line x1="640" y1="140" x2="640" y2="650" stroke="#E8F4FC" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ====== 右侧：模型配置 ====== -->
  <g id="right-config">
    <text x="660" y="158" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">实验模型配置</text>
    <line x1="660" y1="164" x2="880" y2="164" stroke="#0066CC" stroke-width="2"/>

    <!-- 模型配置表格 -->
    <rect x="660" y="174" width="565" height="420" fill="#FFFFFF" rx="8" filter="url(#cardShadow)" stroke="#D0D7E0" stroke-width="1"/>

    <!-- 表头 -->
    <rect x="660" y="174" width="565" height="38" fill="#003366" rx="8"/>
    <rect x="660" y="196" width="565" height="16" fill="#003366"/>
    <text x="775" y="199" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">组件</text>
    <text x="1050" y="199" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">选用模型/方案</text>
    <line x1="880" y1="212" x2="880" y2="594" stroke="#E8F4FC" stroke-width="1"/>

    <!-- 行1 -->
    <rect x="660" y="212" width="565" height="42" fill="#F5F7FA"/>
    <text x="680" y="238" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">嵌入 / 重排</text>
    <text x="892" y="238" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">BGE-m3 (BAAI)</text>

    <!-- 行2 -->
    <rect x="660" y="254" width="565" height="42" fill="#FFFFFF"/>
    <text x="680" y="280" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">图构建（Graphiti）</text>
    <text x="892" y="280" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">gpt-4o-mini-2024-07-18</text>

    <!-- 行3 -->
    <rect x="660" y="296" width="565" height="42" fill="#F5F7FA"/>
    <text x="680" y="322" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">响应生成（方案A）</text>
    <text x="892" y="322" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">gpt-4o-mini-2024-07-18</text>

    <!-- 行4 -->
    <rect x="660" y="338" width="565" height="42" fill="#FFFFFF"/>
    <text x="680" y="364" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">响应生成（方案B）</text>
    <text x="892" y="364" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">gpt-4o-2024-11-20</text>

    <!-- 行5 -->
    <rect x="660" y="380" width="565" height="42" fill="#F5F7FA"/>
    <text x="680" y="406" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">DMR历史对比</text>
    <text x="892" y="406" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">gpt-4-turbo-2024-04-09</text>

    <!-- 行6 -->
    <rect x="660" y="422" width="565" height="42" fill="#FFFFFF"/>
    <text x="680" y="448" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">LME 答案评判</text>
    <text x="892" y="448" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">GPT-4o（含问题专属提示）</text>

    <!-- 行7 -->
    <rect x="660" y="464" width="565" height="42" fill="#F5F7FA"/>
    <text x="680" y="490" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Zep 检索数量</text>
    <text x="892" y="490" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">Top-20 边（事实）+ 实体节点</text>

    <!-- 行8 -->
    <rect x="660" y="506" width="565" height="42" fill="#FFFFFF"/>
    <text x="680" y="532" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">测试环境</text>
    <text x="892" y="527" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">消费级笔记本（Boston, MA）</text>
    <text x="892" y="545" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">→ Zep 部署于 AWS us-west-2</text>

    <!-- 重要提示 -->
    <rect x="660" y="548" width="565" height="46" fill="#FFF5E8" rx="6"/>
    <rect x="660" y="548" width="4" height="46" fill="#F07C00" rx="2"/>
    <text x="678" y="567" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">注意：</text>
    <text x="730" y="567" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">网络延迟包含在 Zep 延迟测量中（不利于 Zep）</text>
    <text x="678" y="585" fill="#555555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">基线测量在本地执行，无额外网络开销</text>
  </g>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#E8F4FC" stroke-width="1"/>
  <text x="40" y="695" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">来源：arXiv:2501.13956v1 §4</text>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">实验结果</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">8 / 12</text>
</svg>
