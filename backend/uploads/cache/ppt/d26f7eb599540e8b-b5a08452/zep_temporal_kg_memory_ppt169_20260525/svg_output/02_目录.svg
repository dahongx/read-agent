<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- 白色背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 页眉 -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#F07C00"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">目 录</text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">ZEP AI</text>

  <!-- ====== 目录卡片 3行×2列 ====== -->

  <!-- 01 研究背景与动机 -->
  <g id="toc-01">
    <rect x="80" y="95" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="80" y="95" width="6" height="88" fill="#003366" rx="3"/>
    <text x="120" y="143" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">01</text>
    <text x="178" y="137" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">研究背景与动机</text>
    <text x="120" y="165" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">LLM 上下文限制、静态 RAG 局限与 Zep 动机</text>
  </g>

  <!-- 02 知识图谱构建 -->
  <g id="toc-02">
    <rect x="660" y="95" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="660" y="95" width="6" height="88" fill="#003366" rx="3"/>
    <text x="700" y="143" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">02</text>
    <text x="758" y="137" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">知识图谱构建</text>
    <text x="700" y="165" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">三层分级架构：情节、语义实体、社区子图</text>
  </g>

  <!-- 03 双时态模型与实体关系 -->
  <g id="toc-03">
    <rect x="80" y="210" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="80" y="210" width="6" height="88" fill="#0066CC" rx="3"/>
    <text x="120" y="258" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">03</text>
    <text x="178" y="252" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">双时态模型与实体关系</text>
    <text x="120" y="280" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">双时态建模、实体提取、事实关系与边失效</text>
  </g>

  <!-- 04 记忆检索系统 -->
  <g id="toc-04">
    <rect x="660" y="210" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="660" y="210" width="6" height="88" fill="#0066CC" rx="3"/>
    <text x="700" y="258" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">04</text>
    <text x="758" y="252" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">记忆检索系统</text>
    <text x="700" y="280" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">搜索-重排-构造三阶段检索管道</text>
  </g>

  <!-- 05 实验结果 -->
  <g id="toc-05">
    <rect x="80" y="325" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="80" y="325" width="6" height="88" fill="#F07C00" rx="3"/>
    <text x="120" y="373" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">05</text>
    <text x="178" y="367" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">实验结果</text>
    <text x="120" y="395" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">DMR 与 LongMemEval 两大基准评测</text>
  </g>

  <!-- 06 结论与贡献 -->
  <g id="toc-06">
    <rect x="660" y="325" width="540" height="88" fill="#E8F4FC" rx="8"/>
    <rect x="660" y="325" width="6" height="88" fill="#F07C00" rx="3"/>
    <text x="700" y="373" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="bold">06</text>
    <text x="758" y="367" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">结论与贡献</text>
    <text x="700" y="395" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">三大技术贡献与核心量化成果</text>
  </g>

  <!-- 底部装饰说明 -->
  <g id="bottom-note">
    <rect x="80" y="450" width="1120" height="2" fill="#E8F4FC"/>
    <text x="640" y="490" text-anchor="middle" fill="#AAAAAA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">arXiv:2501.13956v1 · Zep AI团队 · 2025年1月</text>
  </g>

  <!-- 页脚 -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#E8F4FC" stroke-width="1"/>
  <text x="640" y="695" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">ZEP论文汇报</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">2 / 12</text>
</svg>
